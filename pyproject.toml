[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "giraffe"
version = "0.1.0"
description = "Guided Image Restoration Agent for Fidelity and Fact Evaluation"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff==0.14.0",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/giraffe"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
